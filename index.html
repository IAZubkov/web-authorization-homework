<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HomeWorks</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="logo">
    <img src="images/logo.png" alt="Logo">
</header>
<main class="container">
    <form class="form-section" id="form">
        <h1>Get your free account</h1>
        <p>Try homeWorks BUSINESS free for 15 days. Downgrade to Basic (Free Forever) anytime.</p>
        <div class="field-group">
            <label class="del"> Full Name
                <input type="text" class="form-input check" placeholder="Full Name">
            </label>
        </div>
        <div class="field-group">
            <label> Your username
                <input type="text" class="form-input check" placeholder="Your username">
            </label>
        </div>
        <div class="field-group">
            <label class="del"> E-mail
                <input type="text" class="form-input check" placeholder="E-mail">
            </label>
        </div>
        <div class="field-group">
            <label> Password
                <span class="password-wrap">
                    <input type="password" class="form-input check" placeholder="Password">
                    <button type="button" class="password-toggle" aria-label="Показать пароль">
                        <svg class="icon-eye" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
                            <circle fill="none" stroke="currentColor" stroke-width="2" cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="icon-eye-off" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                            <line fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </span>
            </label>
        </div>
        <div class="field-group">
            <label class="del"> Repeat Password
                <span class="password-wrap">
                    <input type="password" class="form-input check" placeholder="Repeat Password">
                    <button type="button" class="password-toggle" aria-label="Показать пароль">
                        <svg class="icon-eye" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
                            <circle fill="none" stroke="currentColor" stroke-width="2" cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="icon-eye-off" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                            <line fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </span>
            </label>
        </div>
        <div class="field-group">
            <label for="agree" class="check-box">
                <input type="checkbox" id="agree" class="check">
                Agree to our Terms of Service and Privacy Statement
            </label>
        </div>
        <article>
        <button class="button" type="button" id="btn">Sign Up</button>
        <a href="#" class="question del">Already have an account?</a>
        </article>
    </form>
    <section class="image-section">
        <img src="images/main-image.png" alt="HomeWorks illustration">
    </section>
</main>
<script src="scripts/script.js"></script>
</body>
</html>
